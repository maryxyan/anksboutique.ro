kind = "web"
previewPath = "/"
title = "Ank's Boutique"
version = "1.0.0"
id = "artifacts/ank-boutique"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18850

[services.development]
run = "pnpm --filter @workspace/ank-boutique run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ank-boutique", "run", "build" ]
publicDir = "artifacts/ank-boutique/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18850"
BASE_PATH = "/"
