name: 🚀 Build & Deploy to anksboutique.ro

on:
  push:
    branches:
      - main

concurrency:
  group: anksboutique-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 🔧 Enable Corepack
        run: corepack enable

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      ########################################################
      # Build Frontend
      ########################################################

      - name: 🔨 Build frontend
        run: |
          cd artifacts/ank-boutique
          PORT=300 BASE_PATH=/ pnpm build
          echo "✅ Frontend built"

      ########################################################
      # Verify API
      ########################################################

      - name: 🔨 Verify API build
        run: |
          pnpm --dir artifacts/api-server run build
          echo "✅ API build successful"

      ########################################################
      # Prepare deployment
      ########################################################

      - name: 📋 Prepare frontend deployment
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp artifacts/ank-boutique/dist/index.html deploy/
          cp -R artifacts/ank-boutique/dist/assets deploy/

          cat > deploy/restart.flag <<EOF
          {
            "deployment_time":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit":"${{ github.sha }}",
            "branch":"${{ github.ref_name }}",
            "run_number":"${{ github.run_number }}"
          }
          EOF

          echo "Deployment package:"
          find deploy -maxdepth 2 -type f | sort

      ########################################################
      # Deploy Frontend
      ########################################################

      - name: 🌐 Deploy frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          local-dir: deploy/
          server-dir: public_html/

          exclude: |
            **/.gitkeep
            **/error_log

      ########################################################
      # Deploy API source
      ########################################################

      - name: 🚀 Deploy API source
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          local-dir: artifacts/api-server/
          server-dir: temp_repo/artifacts/api-server/

          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/dist/**
            **/.env
            **/.env.*
            **/*.pid
            **/*.log
            **/uploads/**
            **/error_log

      ########################################################
      # Finished
      ########################################################

      - name: ✅ Deployment complete
        run: |
          echo "======================================"
          echo "✅ Frontend deployed"
          echo "✅ API source deployed"
          echo "✅ restart.flag uploaded"
          echo ""
          echo "The server will:"
          echo "  • Detect restart.flag"
          echo "  • Rebuild the API"
          echo "  • Restart the Node.js process"
          echo "======================================"
