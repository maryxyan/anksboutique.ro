name: Build, Verify & Deploy Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify production builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anks_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anks_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workspace
        run: pnpm run lint

      - name: Run automated tests
        run: pnpm run test

      - name: Validate migration history
        run: pnpm run db:migration:check

      - name: Check for uncommitted schema migrations
        run: |
          pnpm run db:migration:generate
          git diff --exit-code -- lib/db/drizzle

      - name: Apply migrations to clean CI database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/anks_ci
        run: |
          pnpm run db:migration:apply
          pnpm run db:migration:apply

      # The API's project references resolve through declaration files emitted by
      # these composite library projects. Build them before running `--noEmit` on
      # the API, especially on a fresh CI checkout where lib/*/dist does not exist.
      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Typecheck frontend
        run: pnpm --filter @workspace/ank-boutique typecheck

      - name: Build frontend
        env:
          BASE_PATH: /
        run: pnpm --filter @workspace/ank-boutique build

      - name: Store verified frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: artifacts/ank-boutique/dist
          if-no-files-found: error
          retention-days: 30

      - name: Create release metadata
        run: |
          mkdir release-metadata
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "created_at=$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          } > release-metadata/release.txt
          find artifacts/ank-boutique/dist -type f -print0 \
            | sort --zero-terminated \
            | xargs --null sha256sum \
            > release-metadata/frontend-sha256.txt

      - name: Store release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-metadata-${{ github.sha }}
          path: release-metadata
          if-no-files-found: error
          retention-days: 90

  migrate-production:
    name: Apply production database migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://workspaceapi-server-production-17e0.up.railway.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.41.2

      - name: Check Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "Missing one or more required Railway repository secrets."
            echo "Required: RAILWAY_TOKEN, RAILWAY_PROJECT_ID, RAILWAY_SERVICE_ID"
            exit 1
          fi

      - name: Apply migrations using Railway database variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment production \
            --service "$RAILWAY_SERVICE_ID" \
            --json
          railway run --no-local -- sh -c \
            'test -n "$DATABASE_URL" || { echo "DATABASE_URL is missing from the linked Railway API service." >&2; exit 1; }; exec pnpm run db:migration:apply'

  deploy-api:
    name: Deploy API to Railway
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: migrate-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://workspaceapi-server-production-17e0.up.railway.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.41.2

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "Missing one or more required Railway repository secrets."
            echo "Required: RAILWAY_TOKEN, RAILWAY_SERVICE_ID"
            exit 1
          fi

          railway up \
            --ci \
            --service "$RAILWAY_SERVICE_ID" \
            --message "GitHub Actions API deploy ${GITHUB_SHA}"

      - name: Verify deployed API health
        env:
          API_HEALTH_URL: https://workspaceapi-server-production-17e0.up.railway.app/api/readyz
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 10 \
            --retry-delay 6 \
            --retry-all-errors \
            --max-time 10 \
            "$API_HEALTH_URL"

  deploy-frontend:
    name: Deploy frontend via FTP
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://anksboutique.ro

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download verified frontend build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist

      - name: Prepare frontend deployment bundle
        run: |
          mkdir deploy
          cp -R public_html/. deploy/
          rm -rf deploy/assets
          rm -f deploy/index.html
          cp -R frontend-dist/assets deploy/assets
          cp frontend-dist/index.html deploy/index.html

      - name: Check FTP configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Missing one or more required FTP repository secrets."
            echo "Required: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD"
            exit 1
          fi

      - name: Deploy frontend
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/uploads/**
            **/*.log
            **/error_log

      - name: Verify deployed storefront
        env:
          STOREFRONT_URL: https://anksboutique.ro
        run: |
          expected_asset="$(grep -oE 'src="/assets/index-[^"]+\.js"' frontend-dist/index.html | head -n 1 | cut -d '"' -f 2)"

          if [ -z "$expected_asset" ]; then
            echo "Could not identify the frontend entry asset in the verified build."
            exit 1
          fi

          for attempt in {1..10}; do
            if curl --fail --show-error --silent --location --max-time 15 \
              "$STOREFRONT_URL/" --output "$RUNNER_TEMP/storefront.html" \
              && grep --fixed-strings --quiet "$expected_asset" "$RUNNER_TEMP/storefront.html"; then
              curl --fail --show-error --silent --location --max-time 15 \
                "$STOREFRONT_URL$expected_asset" --output /dev/null
              echo "Storefront is serving the verified frontend build."
              exit 0
            fi

            echo "Attempt $attempt: verified frontend build is not live yet."
            sleep 6
          done

          echo "Storefront did not serve the verified frontend build in time."
          exit 1
