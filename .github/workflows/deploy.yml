name: 🚀 Build & Deploy to anksboutique.ro

on:
  push:
    branches:
      - main

concurrency:
  group: anksboutique-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 🔧 Enable Corepack
        run: corepack enable

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      ########################################################
      # Build Frontend
      ########################################################

      - name: 🔨 Build frontend
        run: |
          cd artifacts/ank-boutique
          PORT=300 BASE_PATH=/ pnpm build
          echo "✅ Frontend built"

      - name: 📋 Copy build to public_html
        run: |
          rm -rf public_html/assets public_html/index.html
          cp -r artifacts/ank-boutique/dist/assets public_html/assets
          cp artifacts/ank-boutique/dist/index.html public_html/index.html
          echo "✅ Copied to public_html/"

      - name: 📂 Deploy API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
      
          local-dir: artifacts/api-server/
          server-dir: temp_repo/artifacts/api-server/
      
          exclude: |
            **/node_modules/**
            **/.git/**
            **/.idea/**
            **/.env
            **/*.log
            **/.gitkeep
            **/error_log
