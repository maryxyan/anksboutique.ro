name: 🚀 Build & Deploy to anksboutique.ro

on:
  push:
    branches:
      - main

concurrency:
  group: anksboutique-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build frontend
        run: |
          cd artifacts/ank-boutique
          PORT=300 BASE_PATH=/ pnpm build
          echo "✅ Frontend built"

      - name: 📋 Prepare frontend deployment
        run: |
          rm -rf public_html
          mkdir -p public_html

          cp -r artifacts/ank-boutique/dist/assets public_html/
          cp artifacts/ank-boutique/dist/index.html public_html/

          echo "✅ Frontend ready"

      - name: 🚩 Create restart flag
        run: |
          cat > public_html/restart.flag <<EOF
          {
            "deployment_time":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit":"${{ github.sha }}",
            "branch":"${{ github.ref_name }}",
            "run_number":"${{ github.run_number }}"
          }
          EOF

          echo "✅ Restart flag created"
          cat public_html/restart.flag

      - name: 🌐 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public_html/
          server-dir: public_html/
          exclude: |
            **/.gitkeep
            **/error_log

      - name: ✅ Deployment complete
        run: |
          echo "Frontend deployed."
          echo "restart.flag uploaded."
          echo "The cron job will restart the API if needed."
