name: 🚀 Build & Deploy to anksboutique.ro

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 📦 Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🔨 Build frontend
        run: |
          cd artifacts/ank-boutique
          PORT=300 BASE_PATH=/ pnpm build
          echo "✅ Frontend built"

      - name: 📋 Copy build to public_html
        run: |
          rm -rf public_html/assets public_html/index.html
          cp -r artifacts/ank-boutique/dist/assets public_html/assets
          cp artifacts/ank-boutique/dist/index.html public_html/index.html
          echo "✅ Copied to public_html/"

      - name: 📂 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: public_html/
          server-dir: public_html/
          exclude: |
            **/.gitkeep
            **/error_log
