name: Build & Verify for Railway

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Railway build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API's project references resolve through declaration files emitted by
      # these composite library projects. Build them before running `--noEmit` on
      # the API, especially on a fresh CI checkout where lib/*/dist does not exist.
      - name: Typecheck libraries
        run: pnpm run typecheck:libs

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Typecheck frontend
        run: pnpm --filter @workspace/ank-boutique typecheck

      - name: Build frontend
        env:
          BASE_PATH: /
        run: pnpm --filter @workspace/ank-boutique build

      - name: Railway deployment handoff
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "Build verified. Railway deploys this commit through its GitHub integration."
