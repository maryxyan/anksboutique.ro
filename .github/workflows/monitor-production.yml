name: Monitor Production

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: production-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    name: Check API readiness and storefront
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check API readiness
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 15 \
            https://workspaceapi-server-production-17e0.up.railway.app/api/readyz

      - name: Check storefront
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 15 \
            https://anksboutique.ro/ \
            | grep --fixed-strings --quiet '<div id="root"></div>'
